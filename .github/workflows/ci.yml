name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-agent:
    name: Contracts and agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - name: Build and test contracts
        working-directory: contracts
        run: |
          forge build
          forge test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Test agent (includes a local-chain test against the real contracts)
        working-directory: agent
        run: |
          npm ci
          npm run typecheck
          npm test

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test, lint and build
        working-directory: web
        run: |
          npm ci
          npx vitest run
          npm run lint
          npm run build
